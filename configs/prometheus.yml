# Prometheus Configuration for Threat Intelligence Agent

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'threat-intel-agent'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager targets if needed

# Rule files
rule_files:
  # - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Threat Intel Agent metrics
  - job_name: 'threat-intel-agent'
    static_configs:
      - targets: ['threat-intel-agent:8080']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  # Redis metrics (requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ChromaDB metrics
  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']
    metrics_path: '/metrics'
