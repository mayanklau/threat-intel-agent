# Threat Intelligence Agent - Docker Compose
# Full stack deployment with all dependencies

version: '3.9'

services:
  # ============================================================================
  # Threat Intel Agent API
  # ============================================================================
  threat-intel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: threat-intel-agent:latest
    container_name: ti-agent
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Environment
      - ENVIRONMENT=production
      - DEBUG=false
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_WORKERS=4
      - API_LOG_LEVEL=INFO
      # Memory Configuration
      - MEMORY_REDIS_URL=redis://redis:6379/0
      - MEMORY_CHROMA_HOST=chromadb
      - MEMORY_CHROMA_PORT=8000
      # Threat Feed API Keys (set via .env file)
      - THREATFEED_OTX_API_KEY=${OTX_API_KEY:-}
      - THREATFEED_VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - THREATFEED_ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - THREATFEED_MISP_URL=${MISP_URL:-}
      - THREATFEED_MISP_API_KEY=${MISP_API_KEY:-}
      # SLM Configuration
      - SLM_MODEL_SIZE=medium
      - SLM_DEVICE=cpu
      # Agent Configuration
      - AGENT_MAX_CONCURRENT_TASKS=10
      - AGENT_AUTO_CORRELATE=true
    volumes:
      - ./data/models:/app/data/models:ro
      - ./data/embeddings:/app/data/embeddings
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ti-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ============================================================================
  # Redis - Working Memory Backend
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ti-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ti-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================================================
  # ChromaDB - Vector Database for Semantic/Episodic Memory
  # ============================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: ti-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=False
      - IS_PERSISTENT=True
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ti-network
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================================
  # Prometheus - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ti-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ti-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Grafana - Visualization Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ti-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ti-network
    deploy:
      resources:
        limits:
          memory: 256M

# ============================================================================
# Networks
# ============================================================================
networks:
  ti-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
    driver: local
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
